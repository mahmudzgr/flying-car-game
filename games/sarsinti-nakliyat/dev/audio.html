<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarsıntı — Ses laboratuvarı</title>
<style>body{font:15px system-ui;margin:16px}button{margin:3px;padding:8px 10px}label{display:block;margin:8px 0}</style></head>
<body><h1>Ses laboratuvarı</h1>
<p><button id="unlock">Sesi aç (unlock)</button> <select id="trk"><option value="">(müzik yok)</option><option>menu</option><option>elma</option><option>kanyon</option></select></p>
<label>Araç <select id="veh"><option>tosun</option><option>zipir</option><option>pasa</option><option>koca</option></select></label>
<label>rpm <input id="rpm" type="range" min="0" max="1" step="0.01" value="0.3"></label>
<label>gaz/yük <input id="load" type="range" min="0" max="1" step="0.01" value="0.5"></label>
<label><input id="gnd" type="checkbox" checked> yerde</label>
<h3>Olaylar</h3><div id="ev"></div>
<script type="module">
import { createAudio } from '../src/audio/index.js';
import { EVENT_NAMES } from '../src/events.js';
const a = createAudio(); const $ = (i) => document.getElementById(i);
$('unlock').onclick = () => a.unlock(); $('trk').onchange = () => a.music($('trk').value || null);
const push = () => a.setEngine({ vehicleId: $('veh').value, rpm01: +$('rpm').value, throttle: +$('load').value, load: +$('load').value, onGround: $('gnd').checked });
for (const i of ['veh', 'rpm', 'load', 'gnd']) $(i).oninput = push; setInterval(push, 50);
for (const n of EVENT_NAMES) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { a.unlock(); a.onEvent({ name: n, t: 0, surface: 'dirt', type: 'crate', speed: 8, impactSpeed: 6, wheel: 'rear', slip: 5, count: 1, multiplier: 2, on: true }); }; $('ev').append(b); }
</script></body></html>
