/* Tam ekran oyun: tek bir görsel dünya (açık/koyu temadan bağımsız) */
:root {
  --ink: #2a2140;
  --ink-2: #4b3f6b;
  --paper: #fff7e8;
  --paper-2: #f6e6c8;
  --muted: #d9ccb4;
  --sun: #ffb43a;
  --berry: #ff5f6d;
  --leaf: #5cc84a;
  --sky: #45a3f0;
  --grape: #9b7cf0;
  --rust: #c2410c;
  --white: #ffffff;
  --dim: rgba(26, 18, 46, 0.58);
  --fd: 'DynaPuff', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --fu: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --outline: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #3d9be9; }
body {
  font-family: var(--fu); color: var(--ink); -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none;
  -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
#app { position: fixed; inset: 0; overflow: hidden; background: #3d9be9; container: app / size; }
#app.rot { inset: auto; left: 0; top: 0; transform-origin: 0 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui > #hint, #ui > #banner, #ui > #combo, #ui > #toasts { pointer-events: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.ic { width: 22px; height: 22px; display: block; flex: none; }

.bigstar:nth-child(2) .ic { width: 78px; height: 78px; }
.bigstar:nth-child(2) { transform: translateY(-10px); }
.bigstar.on { color: var(--sun); animation: starpop .55s cubic-bezier(.2,1.8,.4,1) both; animation-delay: var(--d); }
.bigstar.on:nth-child(2) { animation-name: starpop2; }
@keyframes starpop { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes starpop2 { 0% { transform: translateY(-10px) scale(0) rotate(-90deg); } 100% { transform: translateY(-10px) scale(1) rotate(0); } }
.score-big { font: 700 36px var(--fd); font-variant-numeric: tabular-nums; }
.wave-big { font: 700 24px var(--fd); color: var(--berry); }
.newbest { font: 600 16px var(--fd); color: #fff; background: var(--berry); border: 3px solid var(--ink); border-radius: 12px; padding: 2px 12px; transform: rotate(-3deg); animation: wig 1s ease-in-out infinite; }
@keyframes wig { 50% { transform: rotate(3deg) scale(1.05); } }
.p-btns { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 16px; }
.p-btns.col { flex-direction: column; }
.p-btns .grow { flex: 1; }
.p-btns .wide { width: 100%; }
.toggles { display: flex; gap: 14px; justify-content: center; padding: 6px 0 2px; }
.got { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.got canvas { animation: pop .4s cubic-bezier(.2,1.6,.4,1) both; }
.intro-icon { width: 92px; height: 92px; animation: floaty 2s ease-in-out infinite; }
.lose-blob { height: 96px; animation: floaty 1.4s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-6px) rotate(3deg); } }
@media (orientation: landscape) and (max-height: 520px) {
  #modal { padding-top: 22px; }
  .panel { padding-bottom: 14px; }
  .bigstar .ic { width: 46px; height: 46px; }
  .bigstar:nth-child(2) .ic { width: 56px; height: 56px; }
  .score-big { font-size: 28px; }
  .p-btns { margin-top: 10px; }
  .ribbon { font-size: 19px; }
}
@container app (orientation: landscape) and (max-height: 520px) {
  #modal { padding-top: 22px; }
  .panel { padding-bottom: 14px; }
  .bigstar .ic { width: 46px; height: 46px; }

  .score-big { font-size: 28px; }
  .p-btns { margin-top: 10px; }
  .ribbon { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

      blink: Math.random() * 3, mood: 'idle', moodT: 0, squash: 0, wob: Math.random() * 6.28,
      lookX: x - 5, lookY: y
    });
  };

  /* ---------- Gülleler ---------- */
  P.addProjectile = function (type, x, y, vx, vy, opts) {
    opts = opts || {};
    var t = PK.AMMO[type];
    var r = opts.r || t.r;
    var b = this.world.createBody({ type: 'dynamic', position: V(x, y), bullet: true, angularDamping: 0.6, linearVelocity: V(vx || 0, vy || 0) });
    var f = this.fix(b, pl.Circle(r), { density: t.density, friction: 0.6, rest: 0.22 });
    if (opts.group) f.setFilterData({ groupIndex: opts.group, categoryBits: 1, maskBits: 0xFFFF });
    var e = this.register(b, {
      kind: 'proj', type: type, r: r, used: false, hitT: -1, launchT: this.time,
      mult: t.mult || null, trail: [], child: !!opts.child, group: opts.group || 0
    });
    return e;
  };

  P._setCircle = function (e, r, density) {
    var b = e.body, f = b.getFixtureList();
    var filt = f ? { groupIndex: f.getFilterGroupIndex(), categoryBits: f.getFilterCategoryBits(), maskBits: f.getFilterMaskBits() } : null;
    var fr = f ? f.getFriction() : 0.6, rs = f ? f.getRestitution() : 0.2;
    if (f) b.destroyFixture(f);
    var nf = b.createFixture({ shape: pl.Circle(r), density: density, friction: fr, restitution: rs });
    if (filt) nf.setFilterData(filt);
    e.r = r;
  };

  /* ---------- Yetenekler ---------- */
  P.activateAbility = function (e) {
    if (!e || e.dead || e.used || e.kind !== 'proj') return false;
    var t = PK.AMMO[e.type];
    if (!t.ability) return false;
    if (t.ability !== 'explode' && e.hitT >= 0) return false;
    e.used = true; e.usedT = this.time;
    var b = e.body, p = b.getPosition(), v = b.getLinearVelocity();
    var sp = Math.sqrt(v.x * v.x + v.y * v.y), ang = Math.atan2(v.y, v.x);
    var self = this;
    switch (t.ability) {
      case 'split': {
        var g = -(this.groupCounter++);
        var f0 = b.getFixtureList();
        this._setCircle(e, 0.27, 5);
        b.getFixtureList().setFilterData({ groupIndex: g, categoryBits: 1, maskBits: 0xFFFF });
        e.mult = t.mult; e.group = g;
        var extras = [];
        [-0.2, 0.2].forEach(function (da) {
          var a2 = ang + da;
          var ne = self.addProjectile(e.type, p.x, p.y, Math.cos(a2) * sp, Math.sin(a2) * sp, { r: 0.27, child: true, group: g });
          ne.used = true; ne.mult = t.mult; ne.parent = e;
          extras.push(ne);
        });
        this.emit('ability', { ent: e, kind: 'split', extras: extras, x: p.x, y: p.y });
        break;
      }
      case 'dash': {
        var nv = Math.max(sp * 1.75, 25);
        if (sp < 0.01) { ang = 0; }
        b.setLinearVelocity(V(Math.cos(ang) * nv, Math.sin(ang) * nv));
        b.setGravityScale(0.35);
        e.mult = t.multAfter; e.dash = true;
        this.later(0.9, function () { if (!e.dead) e.body.setGravityScale(1); });
        this.emit('ability', { ent: e, kind: 'dash', x: p.x, y: p.y, ang: ang });
        break;
      }
      case 'explode': {
        this.explode(p.x, p.y, 4.0, 30, 190, { ignore: e, src: e });
        this.kill(e, 'self');
        this.emit('ability', { ent: e, kind: 'explode', x: p.x, y: p.y });
        break;
      }
      case 'grow': {
        this._setCircle(e, e.r * 2.5, 7.5);
        b.setLinearVelocity(V(v.x, v.y));
        e.mult = t.multAfter; e.giant = true;
        this.emit('ability', { ent: e, kind: 'grow', x: p.x, y: p.y });
        break;
      }
      case 'blackhole': {
        b.setLinearVelocity(V(0, 0));
        b.setAngularVelocity(0);
        b.setGravityScale(0);

        b.setType('kinematic');

          ignore: e, ent: e,

    return true;
  };

  /* ---------- Patlama ---------- */
  P.bodiesIn = function (x0, y0, x1, y1) {
    var list = [];
    this.world.queryAABB(pl.AABB(V(x0, y0), V(x1, y1)), function (f) {
      var b = f.getBody();
      if (list.indexOf(b) < 0) list.push(b);
      return true;
    });
    return list;
  };

  P.explode = function (x, y, R, power, dmg, opts) {
    opts = opts || {};
    var bodies = this.bodiesIn(x - R, y - R, x + R, y + R);
    var hits = 0;
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (!b.isDynamic()) continue;
      var e = b.getUserData();
      if (e && (e === opts.ignore || e.dead)) continue;
      var c = b.getWorldCenter();
      var dx = c.x - x, dy = c.y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var rad = e ? (e.r || Math.min(e.w || 0.6, e.h || 0.6) / 2) : 0.3;
      var ds = Math.max(0, d - rad * 0.6);
      if (ds > R) continue;
      var f = 1 - ds / R;
      if (d < 0.001) { dx = 0; dy = 1; d = 1; }
      var m = b.getMass();
      var imp = power * f;
      var maxImp = m * 30;
      if (imp > maxImp) imp = maxImp;
      var nx = dx / d, ny = dy / d;
      var px = c.x - nx * rad * 0.35, py = c.y - ny * rad * 0.35;
      b.applyLinearImpulse(V(nx * imp, ny * imp + imp * 0.2), V(px, py), true);
      hits++;
      if (e && e.hp !== undefined && isFinite(e.hp)) {
        var mf = e.kind === 'blob' ? 1.5 : (e.mat ? PK.MAT[e.mat].expl : 1);
        this.damage(e, dmg * f * f * mf * (opts.dmgMul || 1), opts.src || 'explosion');
      }
      if (e && e.onBlast) e.onBlast(f);

    this.emit('explosion', { x: x, y: y, R: R, power: power, src: opts.src, hits: hits, small: !!opts.small });
  };

  /* ---------- Kara delik ---------- */
  P.addAttractor = function (x, y, o) {
    var a = { x: x, y: y, R: o.R || 6.5, acc: o.acc || 36, t: 0, dur: o.dur || 2.2, core: o.core || 1.2, dps: o.dps || 42,
      ignore: o.ignore, ent: o.ent, onEnd: o.onEnd, swallowed: 0, caught: [] };
    this.attractors.push(a);
    return a;
  };
  P._applyAttractors = function (dt) {
    for (var i = this.attractors.length - 1; i >= 0; i--) {
      var a = this.attractors[i];
      a.t += dt;
      var bodies = this.bodiesIn(a.x - a.R, a.y - a.R, a.x + a.R, a.y + a.R);
      var ramp = Math.min(1, a.t / 0.35);
      for (var k = 0; k < bodies.length; k++) {
        var b = bodies[k];
        if (!b.isDynamic()) continue;
        var e = b.getUserData();
        if (e && (e === a.ignore || e.dead)) continue;
        var c = b.getWorldCenter();
        var dx = a.x - c.x, dy = a.y - c.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > a.R || d < 0.001) continue;
        var nx = dx / d, ny = dy / d;
        var f = Math.pow(1 - d / a.R, 0.5);
        var m = b.getMass();
        var acc = a.acc * f * ramp;
        var v = b.getLinearVelocity();
        // çekim + girdap + sönüm + yerçekimini telafi
        var fx = m * (nx * acc - ny * acc * 0.35) - m * v.x * 1.6 * f;
        var fy = m * (ny * acc + nx * acc * 0.35) - m * v.y * 1.6 * f + m * this.g * 0.9 * f;
        b.applyForceToCenter(V(fx, fy), true);
        b.applyTorque(m * 2 * f, true);
        if (e && a.caught.indexOf(e) < 0) a.caught.push(e);
        if (d < a.core && e && e.hp !== undefined && isFinite(e.hp)) {
          var mf = e.kind === 'blob' ? 1.2 : (e.mat ? Math.max(0.35, PK.MAT[e.mat].expl) : 1);
          this.damage(e, a.dps * dt * mf, 'hole');
        }
      }
      if (a.t >= a.dur) {
        this.attractors.splice(i, 1);
        this.explode(a.x, a.y, 5.0, 18, 45, { ignore: a.ignore, src: 'hole' });
        this.emit('holeEnd', { x: a.x, y: a.y, caught: a.caught.length });
        if (a.onEnd) a.onEnd();

    }
  };

  /* ---------- Hasar ---------- */

    var eA = fA.getBody().getUserData(), eB = fB.getBody().getUserData();
    if (eA && eA.kind === 'proj' && eA.hitT < 0 && !(eB && eB.kind === 'proj')) this._projHit(eA);
    if (eB && eB.kind === 'proj' && eB.hitT < 0 && !(eA && eA.kind === 'proj')) this._projHit(eB);
  };

  P._projHit = function (e) {

  P._preSolve = function (contact) {
    var fA = contact.getFixtureA(), fB = contact.getFixtureB();
    if (fA.isSensor() || fB.isSensor()) return;
    var man = contact.getManifold();
    var pc = man.pointCount;
    if (!pc) return;
    var bA = fA.getBody(), bB = fB.getBody();
    var wm = contact.getWorldManifold(null);
    if (!wm) return;
    var nx = wm.normal.x, ny = wm.normal.y;
    var best = 0, bx = 0, by = 0;
    for (var i = 0; i < pc; i++) {
      var p = wm.points[i];
      var va = bA.getLinearVelocityFromWorldPoint(p), vb = bB.getLinearVelocityFromWorldPoint(p);
      var vn = (va.x - vb.x) * nx + (va.y - vb.y) * ny;
      if (vn > best) { best = vn; bx = p.x; by = p.y; }
    }
    if (best < 0.9) return;
    var mA = bA.isDynamic() ? bA.getMass() : 0, mB = bB.isDynamic() ? bB.getMass() : 0;
    var meff = (mA && mB) ? mA * mB / (mA + mB) : (mA || mB);
    if (!meff) return;
    var E = 0.5 * meff * best * best;
    if (E < 0.2) return;
    var eA = bA.getUserData(), eB = bB.getUserData();
    this._impact(eA, eB, E, bx, by, best);
    this._impact(eB, eA, E, bx, by, best);
  };

  P._impact = function (e, other, E, x, y, vn) {
    if (!e) return;
    var mult = 1;
    if (other && other.kind === 'proj' && other.mult) {
      var key = e.kind === 'blob' ? 'blob' : e.mat;
      if (other.mult[key]) mult = other.mult[key];
    }
    var dmg = E * mult * this.dmgScale;
    this.emit('impact', { ent: e, other: other, E: E, dmg: dmg, x: x, y: y, vn: vn });
    if (this.time < this.dmgStart) return;
    if (e.hp !== undefined && isFinite(e.hp)) this.damage(e, dmg, other);
  };

  P.damage = function (e, amt, src) {
    if (e.dead || !(e.hp > 0) || e.invuln) return;
    if (amt < 0.35) return;
    e.hp -= amt;
    e.hurtT = this.time;
    if (e.kind === 'blob') { e.squash = Math.min(1, e.squash + 0.3 + amt / e.maxHp); }
    if (e.hp <= 0) this.kill(e, src);
    else this.emit('damage', { ent: e, amt: amt, src: src });
  };

  P.kill = function (e, src) {
    if (e.dead) return;

    this.toKill.push(e);
  };

  P.removeEnt = function (e) {
    if (e.body && !e.removed) {

      this.world.destroyBody(e.body);
    }
    e.dead = true;
  };

  P._processKills = function () {
    var guard = 0;
    while (this.toKill.length && guard++ < 10) {
      var list = this.toKill; this.toKill = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e.removed) continue;
        var p = e.body.getPosition();
        var vel = e.body.getLinearVelocity();
        e.x = p.x; e.y = p.y;
        if (e.kind === 'blob') this.emit('blobDeath', { ent: e, src: e.killSrc, vx: vel.x, vy: vel.y });
        else if (e.kind === 'block') this.emit('break', { ent: e, src: e.killSrc, vx: vel.x, vy: vel.y });
        else this.emit('remove', { ent: e, src: e.killSrc });
        if (e.mat && PK.MAT[e.mat].explosive && !e.lost) {
          var self = this, ex = p.x, ey = p.y, sc = (e.w || 1);
          var chain = e.killSrc === 'explosion' || (e.killSrc && e.killSrc.kind === 'tnt');
          this.later(chain ? 0.09 + Math.random() * 0.06 : 0.0, function (x, y, s) {
            return function () { self.explode(x, y, 3.6 * s, 24 * s, 170 * s, { src: 'explosion' }); };
          }(ex, ey, sc));
        }
        this.removeEnt(e);

  };

  /* ---------- Adım ---------- */
  P.step = function (dt) {
    var ents = this.ents, i, e;
    for (i = 0; i < ents.length; i++) { e = ents[i]; e.px = e.x; e.py = e.y; e.pa = e.a; }
    if (this.attractors.length) this._applyAttractors(dt);
    for (i = 0; i < this.forceEnts.length; i++) {
      e = this.forceEnts[i];
      if (e.dead || e.removed) { this.forceEnts.splice(i--, 1); continue; }
      e.force(this, dt);

    this.world.step(dt, this.velIters, this.posIters);
    this.time += dt;
    var B = this.bounds;
    for (i = 0; i < ents.length; i++) {
      e = ents[i];
      if (e.removed) continue;
      var b = e.body;
      if (b.isStatic()) continue;
      var p = b.getPosition();
      e.x = p.x; e.y = p.y; e.a = b.getAngle();
      if (!e.dead && (p.y < B.minY || p.x < B.minX || p.x > B.maxX || p.y > 400)) {

      if (e.kind === 'proj' && !e.dead && !e.used && e.type === 'bomb' && e.hitT >= 0 && this.time - e.hitT > 1.3) {

    if (this.timers.length) {
      var now = this.time, due = [];
      for (i = this.timers.length - 1; i >= 0; i--) if (this.timers[i].t <= now) { due.push(this.timers[i]); this.timers.splice(i, 1); }

  };

/* ===== 03_builder.js ===== */
/* Bölüm kurucu: kısa ve okunur bölüm tarifleri için yardımcılar.
   (x, y) = nesnenin TABAN ortası; y = 0 zemin. Sapan x = 0'da. */

PK.SLING_H = 2.0;      // çatal yüksekliği
PK.PULL_MAX = 1.55;    // gerilmede güllenin en fazla geri gidişi (m)

PK.vmaxFor = function (g) { return 21 * Math.sqrt(g / 10); };

// Atış başlangıcı: sapandan açı (rad) ve güç (0..1)
PK.shotStart = function (sling, angle, power, g) {
  var vmax = PK.vmaxFor(g);
  var rx = sling.x, ry = sling.y + PK.SLING_H;
  var pull = PK.PULL_MAX * power;
  var c = Math.cos(angle), s = Math.sin(angle);
  return { x: rx - c * pull, y: ry - s * pull, vx: c * vmax * power, vy: s * vmax * power };
};

PK.Builder = function (pw, opts) {
  opts = opts || {};
  this.pw = pw;
  this.sleep = opts.sleep !== false;
  this.sling = { x: 0, y: 0 };
  this.minX = 0; this.maxX = 8; this.maxY = 6;
  this.theme = opts.theme || 'meadow';
};

(function (B) {
  var T = 0.3; // kalas kalınlığı
  B._ext = function (x0, x1, y1) {
    if (x0 < this.minX) this.minX = x0;
    if (x1 > this.maxX) this.maxX = x1;
    if (y1 > this.maxY) this.maxY = y1;
  };
  B._o = function () { return { sleep: this.sleep }; };

  B.slingAt = function (x, y) {
    this.sling = { x: x, y: y || 0 };
    if (y > 0) this.hill(x - 9, x + 2.4, y, 1.0);
    return this;
  };
  B.box = function (mat, x, y, w, h, ang) {
    w = w || 1; h = h || w;
    this._ext(x - w / 2, x + w / 2, y + h);
    return this.pw.addBlock(mat, x, y + h / 2, w, h, ang || 0, this._o());
  };
  B.post = function (mat, x, y, h, t) { return this.box(mat, x, y, t || T, h || 2); };
  B.beam = function (mat, x, y, w, t) { return this.box(mat, x, y, w || 3, t || T); };
  B.tri = function (mat, x, y, w, h, kind) {
    this._ext(x - w / 2, x + w / 2, y + h);
    return this.pw.addTri(mat, x, y, w, h || w, kind, this._o());
  };
  B.ball = function (mat, x, y, r) {
    this._ext(x - r, x + r, y + 2 * r);
    return this.pw.addBall(mat, x, y + r, r, this._o());
  };
  B.blob = function (x, y, type) {
    var t = PK.BLOB[type || 'normal'];
    this._ext(x - t.r, x + t.r, y + 2 * t.r);
    return this.pw.addBlob(x, y + t.r, type || 'normal', this._o());
  };
  B.tnt = function (x, y, s) { s = s || 0.9; this._ext(x - s / 2, x + s / 2, y + s); return this.pw.addTNT(x, y + s / 2, s, this._o()); };

  // Statik kaya / platform (taban ortası)
  B.rock = function (x, y, w, h, style) {
    this._ext(x - w / 2, x + w / 2, y + h);
    return this.pw.addTerrainRect(x, y + h / 2, w, h, style || this.theme);
  };
  // Tepe: x0..x1 tabanlı, h yüksekliğinde yamuk; inset = üst kenarın içe çekilmesi
  B.hill = function (x0, x1, h, inset) {
    inset = inset == null ? 1 : inset;
    this._ext(x0, x1, h);
    return this.pw.addTerrainPoly([[x0, 0], [x1, 0], [x1 - inset, h], [x0 + inset, h]], this.theme);
  };
  // Havada sabit platform (dekoratif ayaklı)

/* Sonsuz Kuşatma ve menü gösterisi için prosedürel kale üretici */

PK.genFort = function (wave, seed, opts) {
  opts = opts || {};
  var U = PK.U;
  var r = U.rng(seed >>> 0);
  var cycle = Math.floor((wave - 1) / 5);
  var worldIdx = opts.world != null ? opts.world : cycle % 4;
  var d = wave; // zorluk
  var boss = wave % 5 === 0;
  var mats;
  if (d <= 2) mats = ['wood', 'wood', 'glass'];
  else if (d <= 5) mats = ['wood', 'wood', 'glass', 'stone'];
  else if (d <= 10) mats = ['wood', 'glass', 'stone', 'ice', 'stone'];
  else mats = ['wood', 'stone', 'ice', 'metal', 'glass', 'stone'];
  if (worldIdx === 2) mats = mats.concat(['ice', 'ice']);
  if (worldIdx === 3) mats = mats.concat(['glass', 'metal']);
  function pm() { return mats[Math.floor(r() * mats.length)]; }
  function blobType() {
    var h = Math.min(0.35, Math.max(0, (d - 7) * 0.03));
    var x = r();
    if (x < h) return 'helmet';
    if (x < h + 0.15) return 'small';
    if (d > 6 && x > 0.9) return 'big';
    return 'normal';
  }
  var wantBlobs = Math.min(2 + Math.floor(d / 4), 6);
  if (d === 1) wantBlobs = 2;
  var tntChance = d >= 3 ? 0.25 : 0;

  function build(b) {
    var x = 11 + r() * 2.5;
    var maxX = 24 + Math.min(10, d * 0.5);
    var blobs = 0;
    var placedKing = false;
    if (d >= 6 && r() < 0.3) b.slingAt(0, 1.5 + Math.round(r() * 2) * 0.5);
    var mods = ['house', 'tower', 'pyramid', 'stack', 'house', 'tower', 'bunker', 'ledge', 'twin'];
    var guard = 0;
    while (x < maxX && guard++ < 12) {
      var m = U.pick(mods, r);
      var mat = pm();
      var w;
      var needBlob = blobs < wantBlobs;
      if (boss && !placedKing && x > 15) m = 'kingtower';
      switch (m) {
        case 'house': {
          w = 2.2 + r() * 1.2;
          var h = 1.6 + r() * 0.8;
          var top = b.frame(mat, x + w / 2, 0, w, h, { blob: needBlob ? blobType() : null });
          if (needBlob) blobs++;
          if (r() < 0.5 && blobs < wantBlobs) { b.blob(x + w / 2, top, blobType()); blobs++; }
          else if (r() < 0.5) b.tri(pm(), x + w / 2, top, w * 0.9, 0.9);
          break;
        }
        case 'tower': {
          w = 2.4 + r() * 0.8;
          var fl = 2 + Math.floor(r() * Math.min(3, 1 + d / 3));
          var bl = [];
          for (var i = 0; i < fl; i++) { if (blobs < wantBlobs && r() < 0.65) { bl.push(blobType()); blobs++; } else bl.push(null); }
          var t2 = b.tower(r() < 0.5 ? mat : [mat, pm()], x + w / 2, 0, fl, w, 1.5 + r() * 0.6, { blobs: bl });
          if (blobs < wantBlobs && r() < 0.6) { b.blob(x + w / 2, t2, blobType()); blobs++; }
          break;
        }
        case 'pyramid': {
          var n = 2 + Math.floor(r() * 2);
          w = n * 1.0;
          var pt = b.pyramid(mat, x + w / 2, 0, n, 1);
          if (blobs < wantBlobs) { b.blob(x + w / 2, pt, blobType()); blobs++; }
          break;
        }
        case 'stack': {
          w = 1.2;
          var hgt = 1 + Math.floor(r() * 3);
          var st = b.stack(mat, x + 0.6, 0, hgt, 1);
          if (tntChance && r() < tntChance) { b.tnt(x + 0.6, st); }
          else if (blobs < wantBlobs) { b.blob(x + 0.6, st, blobType()); blobs++; }
          break;
        }
        case 'bunker': {
          w = 3.2;
          var bm = d > 4 ? 'stone' : 'wood';
          b.post(bm, x + 0.3, 0, 1.4, 0.6); b.post(bm, x + w - 0.3, 0, 1.4, 0.6);
          b.beam(bm, x + w / 2, 1.4, w, 0.5);
          if (blobs < wantBlobs) { b.blob(x + w / 2, 0, blobType()); blobs++; }
          if (tntChance && r() < 0.5) b.tnt(x + w / 2, 1.9);
          break;
        }
        case 'ledge': {
          w = 2.6;
          var ly = 2 + Math.round(r() * 3) * 0.5;
          b.rock(x + w / 2, 0, 0.8, ly);
          b.ledge(x + w / 2, ly, w, 0.4);
          b.frame(mat, x + w / 2, ly + 0.4, w - 0.4, 1.4, { blob: blobs < wantBlobs ? blobType() : null });
          if (blobs < wantBlobs) blobs++;
          break;
        }
        case 'twin': {
          w = 4.6;
          var th = 2 + r() * 1.2;
          b.post(mat, x + 0.2, 0, th, 0.4); b.post(mat, x + 1.3, 0, th, 0.4);
          b.post(mat, x + w - 1.3, 0, th, 0.4); b.post(mat, x + w - 0.2, 0, th, 0.4);
          b.beam(pm(), x + w / 2, th, w, 0.3);
          if (blobs < wantBlobs) { b.blob(x + w / 2, 0, blobType()); blobs++; }
          if (blobs < wantBlobs) { b.blob(x + w / 2, th + 0.3, blobType()); blobs++; }
          if (tntChance && r() < tntChance) b.tnt(x + 0.75, 0, 0.8);
          break;
        }
        case 'kingtower': {
          w = 3.4;
          var km = d > 9 ? 'stone' : 'wood';
          var kt = b.tower([km, pm()], x + w / 2, 0, 2, w, 1.8, { blobs: [blobs < wantBlobs ? blobType() : null, null] });
          blobs++;
          b.blob(x + w / 2, kt, 'king');
          placedKing = true;
          break;
        }
      }
      x += w + 0.8 + r() * 1.6;
    }
    if (blobs === 0) b.blob(x + 0.5, 0, 'normal');
    if (boss && !placedKing) b.blob(Math.min(x + 1, 34), 0, 'king');
  }
  return { world: worldIdx, name: 'Dalga ' + wave, build: build, gen: true, wave: wave };
};

PK.Camera = function () {

PK.Camera.prototype.update = function (dt) {
  var k = 1 - Math.exp(-this.follow * dt);

  this.y += (this.ty - this.y) * k;
  this.s += (this.ts - this.s) * k;
  if (this.shakeAmt > 0.01) {
    this.shx = (Math.random() * 2 - 1) * this.shakeAmt;
    this.shy = (Math.random() * 2 - 1) * this.shakeAmt;
    this.shakeAmt *= Math.exp(-7 * dt);
  } else { this.shx = this.shy = 0; this.shakeAmt = 0; }
};
PK.Camera.prototype.snap = function () { this.x = this.tx; this.y = this.ty; this.s = this.ts; };
PK.Camera.prototype.shake = function (px) { if (PK.settings && PK.settings.shake === false) return; this.shakeAmt = Math.min(22, Math.max(this.shakeAmt, px)); };

  function drawCloud(c, x, y, s, col, seed) {

  /* ---------- Zemin ve arazi ---------- */
  R.drawGround = function (ground) {
    var c = this.ctx, th = PK.THEMES[this.theme], G = th.ground;
    var v = this.viewRect();
    var x0 = Math.max(ground ? ground.x0 : -1e4, v.x0 - 1), x1 = Math.min(ground ? ground.x1 : 1e4, v.x1 + 1);
    if (x1 <= x0) return;
    var y0 = Math.min(v.y0 - 1, -2);
    var g = c.createLinearGradient(0, 0, 0, Math.max(-14, y0));
    g.addColorStop(0, G.dirt); g.addColorStop(1, G.dirt2);
    c.fillStyle = g;
    c.fillRect(x0, y0, x1 - x0, -y0);
    // taşlar/katmanlar
    var r0 = Math.floor(x0), r1 = Math.ceil(x1);
    c.fillStyle = U.rgba(G.stone, 0.55);
    for (var xi = r0; xi < r1; xi++) {
      var h = U.hash('g' + xi) % 1000 / 1000;
      if (h < 0.55) continue;
      var py = -0.9 - (h * 7) % 3.2, pr = 0.08 + h * 0.18;
      c.beginPath(); c.ellipse(xi + h, py, pr * 1.4, pr, 0, 0, TAU); c.fill();
    }

    c.fillStyle = G.top2;
    c.fillRect(x0, -0.42, x1 - x0, 0.42);
    c.fillStyle = G.top;
    c.beginPath();
    c.moveTo(x0, -0.3);
    for (var x = Math.floor(x0 * 2) / 2; x <= x1; x += 0.5) {
      var hh = U.hash('w' + Math.round(x * 2)) % 100 / 100;
      c.lineTo(x, -0.3 - hh * 0.06);
      c.lineTo(x + 0.25, -0.18 - hh * 0.08);

    c.lineTo(x1, 0); c.lineTo(x0, 0); c.closePath(); c.fill();
    // ince ışık
    c.fillStyle = U.rgba('#ffffff', this.theme === 'moon' ? 0.15 : 0.25);
    c.fillRect(x0, -0.06, x1 - x0, 0.06);
    // süsler
    this.drawGroundDeco(x0, x1, G);
  };

  R.drawGroundDeco = function (x0, x1, G) {
    var c = this.ctx;
    for (var xi = Math.floor(x0); xi < x1; xi++) {
      var h = (U.hash('d' + xi) % 1000) / 1000;
      if (xi > -3 && xi < 3) continue; // sapanın çevresi

        if (h < 0.35) { // çimen
          c.strokeStyle = '#5aaf3e'; c.lineWidth = 0.05; c.lineCap = 'round';
          c.beginPath(); c.moveTo(xi + h, 0); c.lineTo(xi + h - 0.08, 0.22); c.moveTo(xi + h, 0); c.lineTo(xi + h + 0.05, 0.28); c.moveTo(xi + h, 0); c.lineTo(xi + h + 0.14, 0.18); c.stroke();
        } else if (h > 0.86) {

          c.strokeStyle = '#4c9a35'; c.lineWidth = 0.04;
          c.beginPath(); c.moveTo(fx, 0); c.lineTo(fx, 0.32); c.stroke();
          c.fillStyle = h > 0.93 ? '#ff7aa8' : '#ffd84d';
          for (var k = 0; k < 5; k++) { var a = k / 5 * TAU; c.beginPath(); c.arc(fx + Math.cos(a) * 0.08, 0.36 + Math.sin(a) * 0.08, 0.06, 0, TAU); c.fill(); }

      }

  };

  R.drawTerrain = function (e) {
    var c = this.ctx, th = PK.THEMES[this.theme], RK = th.rock;

    c.translate(e.x, e.y); c.rotate(e.a);
    c.beginPath();

  /* ---------- Blok sprite'ları ---------- */
  function makeCanvas(w, h) {

    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);

  }

  function paintBlock(c, e, stage, variant) {
    var m = PK.MAT[e.mat], w = e.w, h = e.h, lw = 0.05;
    var rng = U.rng(U.hash(e.mat + e.shape + w + 'x' + h + 'v' + variant));
    shapePath(c, e);
    var grad;
    if (e.mat === 'wood') {
      grad = c.createLinearGradient(0, -h / 2, 0, h / 2);
      grad.addColorStop(0, m.light); grad.addColorStop(0.25, m.base); grad.addColorStop(1, U.shade(m.base, -0.12));

        c.beginPath();

          if (horiz) { if (s === -len / 2) c.moveTo(s, o + wv); else c.lineTo(s, o + wv); }
          else { if (s === -len / 2) c.moveTo(o + wv, s); else c.lineTo(o + wv, s); }
        }
        c.stroke();
      }
      if (len > 1.2 && rng() < 0.8) { // budak
        var kx = (rng() - 0.5) * len * 0.6, ky = (rng() - 0.5) * cross * 0.3;
        c.fillStyle = U.rgba(m.dark, 0.35);
        c.beginPath(); if (horiz) c.ellipse(kx, ky, 0.09, 0.05, 0, 0, TAU); else c.ellipse(ky, kx, 0.05, 0.09, 0, 0, TAU); c.fill();
      }

    } else if (e.mat === 'glass') {

      c.beginPath(); c.moveTo(-w / 2 - 0.2, h * 0.1); c.lineTo(-w * 0.1, -h / 2 - 0.2); c.stroke();
      c.lineWidth = Math.min(w, h) * 0.05;

    } else if (e.mat === 'ice') {
      grad = c.createLinearGradient(0, -h / 2, 0, h / 2);
      grad.addColorStop(0, 'rgba(255,255,255,0.95)'); grad.addColorStop(0.35, U.rgba(m.base, 0.9)); grad.addColorStop(1, U.rgba(U.shade(m.base, -0.12), 0.9));
      c.fillStyle = grad; c.fill();
      c.save(); c.clip();
      c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 0.025;
      for (var k = 0; k < 3; k++) {
        var sx = (rng() - 0.5) * w, sy = (rng() - 0.5) * h;
        c.beginPath(); c.moveTo(sx, sy);
        for (var j = 0; j < 3; j++) { sx += (rng() - 0.5) * 0.5; sy += (rng() - 0.5) * 0.5; c.lineTo(sx, sy); }
        c.stroke();
      }
      c.fillStyle = 'rgba(255,255,255,0.55)';

    } else if (e.mat === 'stone') {

      }

        var rows = Math.round(h / 0.5);
        for (var rI = 1; rI < rows; rI++) { var yy = -h / 2 + rI * h / rows; c.beginPath(); c.moveTo(-w / 2, yy); c.lineTo(w / 2, yy); c.stroke(); }
        for (rI = 0; rI < rows; rI++) {
          var y0 = -h / 2 + rI * h / rows, y1 = y0 + h / rows;
          for (var xx = -w / 2 + (rI % 2 ? 0.5 : 1); xx < w / 2 - 0.1; xx += 1) { c.beginPath(); c.moveTo(xx, y0); c.lineTo(xx, y1); c.stroke(); }
        }
      }
      c.restore();
    } else if (e.mat === 'metal') {

      grad.addColorStop(0, m.light); grad.addColorStop(0.45, m.base); grad.addColorStop(0.55, U.shade(m.base, -0.08)); grad.addColorStop(1, U.shade(m.base, -0.25));
      c.fillStyle = grad; c.fill();
      c.save(); c.clip();

      c.restore();

        var pts = [[-w / 2 + ins, -h / 2 + ins], [w / 2 - ins, -h / 2 + ins], [-w / 2 + ins, h / 2 - ins], [w / 2 - ins, h / 2 - ins]];

      c.fillRect(-w / 2, -h / 2 + h * 0.13, w, h * 0.03); c.fillRect(-w / 2, h / 2 - h * 0.16, w, h * 0.03);
      c.restore();
      c.save();
      c.font = '700 ' + (h * 0.36) + 'px ' + PK.FONT_DISPLAY;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = h * 0.07; c.strokeStyle = '#5a1209'; c.strokeText('TNT', 0, h * 0.02);
      c.fillStyle = '#ffe9a8'; c.fillText('TNT', 0, h * 0.02);

    } else if (e.mat === 'rubber' || e.mat === 'iron') {

/* Kayıt: ilerleme, ayarlar, istatistik, başarımlar (localStorage, hata toleranslı) */

PK.settings = { sfx: true, music: true, aim: 'normal', fx: 'high', shake: true };

PK.Save = (function () {
  var KEY = 'paldirkuldur.v1';
  var D = {
    levels: {}, endless: { bestWave: 0, bestScore: 0, runs: 0 },
    stats: { shots: 0, blocks: 0, blobs: 0, glass: 0, tnt: 0, spawns: 0, sbBooms: 0, wins: 0, playSec: 0 },
    ach: {}, seen: {}, fails: {}, settings: PK.settings
  };
  var S = { data: D, dirty: false };
  S.load = function () {
    try {
      var raw = GLOBAL.localStorage && GLOBAL.localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        for (var k in o) if (o[k] && typeof o[k] === 'object' && D[k] && typeof D[k] === 'object') { for (var j in o[k]) D[k][j] = o[k][j]; }
      }
    } catch (e) { }
    PK.settings = D.settings;
  };
  S.save = function () { S.dirty = true; };
  S.flush = function () {
    if (!S.dirty) return;
    S.dirty = false;
    try { GLOBAL.localStorage && GLOBAL.localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { }
  };
  setInterval(function () { S.flush(); }, 1500);
  if (GLOBAL.addEventListener) {
    GLOBAL.addEventListener('pagehide', function () { S.flush(); });
    GLOBAL.addEventListener('visibilitychange', function () { if (document.hidden) S.flush(); });
  }
  S.reset = function () {
    D.levels = {}; D.endless = { bestWave: 0, bestScore: 0, runs: 0 };
    for (var k in D.stats) D.stats[k] = 0;
    D.ach = {}; D.seen = {}; D.fails = {};
    S.save(); S.flush();
  };

  S.lk = function (w, i) { return w + '-' + i; };
  S.level = function (w, i) { return D.levels[S.lk(w, i)] || null; };
  S.setLevel = function (w, i, stars, score) {
    var k = S.lk(w, i), o = D.levels[k] || { stars: 0, score: 0, done: false };
    var res = { newBest: score > o.score, prevStars: o.stars };
    o.done = true;
    o.stars = Math.max(o.stars, stars);
    o.score = Math.max(o.score, score);
    D.levels[k] = o;
    S.save();
    return res;
  };
  S.skipLevel = function (w, i) {
    var k = S.lk(w, i), o = D.levels[k] || { stars: 0, score: 0, done: false };
    o.skipped = true; D.levels[k] = o; S.save();
  };
  S.totalStars = function () { var n = 0; for (var k in D.levels) n += D.levels[k].stars || 0; return n; };
  S.worldStars = function (w) { var n = 0; for (var i = 0; i < 10; i++) { var l = S.level(w, i); if (l) n += l.stars; } return n; };
  S.worldDone = function (w) { var n = 0; for (var i = 0; i < 10; i++) { var l = S.level(w, i); if (l && l.done) n++; } return n; };
  S.isPassed = function (w, i) { var l = S.level(w, i); return !!(l && (l.done || l.skipped)); };
  S.worldUnlocked = function (w) { return w === 0 || S.isPassed(w - 1, 9) || PK.DEBUG_UNLOCK; };
  S.levelUnlocked = function (w, i) {
    if (!S.worldUnlocked(w)) return false;
    return i === 0 || S.isPassed(w, i - 1) || PK.DEBUG_UNLOCK;
  };
  S.fail = function (w, i) { var k = S.lk(w, i); D.fails[k] = (D.fails[k] || 0) + 1; S.save(); return D.fails[k]; };
  S.stat = function (name, add) { D.stats[name] = (D.stats[name] || 0) + (add || 1); S.save(); PK.Ach && PK.Ach.checkStats(); };
  return S;
})();

PK.Input.prototype.updateGesture = function () {
  var a = Array.from(this.ptrs.values());

  S.restart = function () {

  /* ---------- Güncelleme ---------- */
  S.update = function (dt) {
    var R = this.R;

    if (this.paused) { R.cam.update(dt); return; }
    if (this.slowT > 0) { this.slowT -= dt; this.timeScale = this.slowT > 0.25 ? 0.3 : 1; } else this.timeScale = 1;
    if (this.stateWin) { this.stateWin -= dt; if (this.stateWin <= 0) { this.stateWin = 0; this.win(); } }
    var h = STEP;
    this.acc += dt * this.timeScale;
    var n = 0;
    while (this.acc >= h && n < 4) {
      this.pw.step(h);
      this.acc -= h; n++;
      this.afterStep(h);
    }
    if (n >= 4) this.acc = 0;
    this.alpha = this.acc / h;
    this.P.update(dt * this.timeScale, this.g);
    this.stT += dt;
    if (this.laughT > 0 && this.state !== 'lost') this.laughT -= dt;
    if (this.finalFocus) this.finalFocus.t -= dt;
    // durum makinesi
    switch (this.state) {
      case 'intro':
        if (this.stT > (this.demo ? 0.6 : 1.0)) this.loadNext();
        break;
      case 'load':
        if (this.loaded) this.loaded.t += dt;
        if (this.stT > 0.38) { this.state = 'aim'; this.stT = 0; this.aiT = 0; }
        break;
      case 'aim':
        if (this.demo) this.demoAI(dt);
        break;
      case 'fly':
        this.flyT += dt * this.timeScale;
        if (this.winPending) break;
        if (this.flyT > 1.0 && this.pw.isCalm(0.3, 0.5, true)) this.calmT += dt; else this.calmT = 0;
        var hitOver = !this.cur || this.cur.dead || this.cur.hitT >= 0;
        if (this.calmT > 0.45 || this.flyT > 9 || (hitOver && this.flyT > 6.5 && !this.pw.attractors.length && !this.pw.timers.length)) this.endTurn();
        if (this.demo && this.cur && !this.cur.used && this.flyT > this.demoAbT) this.tryAbility();
        if (!this.demo && this.cur && !this.cur.used && this.cur.hitT >= 0 && this.cur.type !== 'bomb' && !this.hintCleared) { this.hintCleared = true; PK.UI.hint(''); }
        break;
    }
    // jöle ruh halleri
    var ents = this.pw.ents, proj = this.cur && !this.cur.dead ? this.cur : null;
    for (var i = 0; i < ents.length; i++) {
      var e = ents[i];
      if (e.kind !== 'blob') continue;
      e.squash = (e.squash || 0) * Math.exp(-3.5 * dt);
      if (this.laughT > 0) e.mood = 'laugh';
      else if (proj && U.dist(proj.x, proj.y, e.x, e.y) < 7 && this.state === 'fly') e.mood = 'scared';
      else e.mood = 'idle';
    }
    this.frame();
    R.cam.update(dt);
  };

  S.afterStep = function (h) {
    this.stepN++;
    var e = this.cur;
    if (e && !e.dead && this.state === 'fly') {
      if ((e.hitT < 0 || this.pw.time - e.hitT < 0.15) && this.stepN % 2 === 0) {
        this.trail.push({ x: e.x, y: e.y, big: this.stepN % 10 === 0 });
        if (this.trail.length > 400) this.trail.shift();
      }
    }
    // kara delik parçacıkları
    if (this.pw.attractors.length && this.stepN % 2 === 0) {
      for (var i = 0; i < this.pw.attractors.length; i++) { var a = this.pw.attractors[i]; this.P.holeSuck(a.x, a.y); }
    }
  };

  /* ---------- Gösteri yapay zekâsı ---------- */
  S.demoAI = function (dt) {
    this.aiT += dt;
    if (this.aiT < 0.9) return;
    if (!this.loaded) return;
    var blobs = this.pw.aliveBlobs();
    if (!blobs.length) return;
    var tgt = blobs[(Math.random() * blobs.length) | 0];
    var rp = this.restPos();
    var g = this.g, best = null;
    for (var p = 0.75; p <= 1.001; p += 0.05) {
      var v = PK.vmaxFor(g) * p;
      var x = tgt.x - rp.x, y = tgt.y - rp.y;
      var disc = v * v * v * v - g * (g * x * x + 2 * y * v * v);
      if (disc < 0) continue;
      var th = Math.atan((v * v - Math.sqrt(disc)) / (g * x));
      if (Math.random() < 0.25) th = Math.atan((v * v + Math.sqrt(disc)) / (g * x));
      best = { a: th + (Math.random() - 0.5) * 0.06, p: p, t: x / (v * Math.cos(th)) };
      break;
    }
    if (!best) best = { a: 0.5, p: 1, t: 1.2 };
    this.demoAbT = Math.max(0.3, best.t * (0.55 + Math.random() * 0.3));
    this.launch(best.a, best.p);
    this.demoShots++;
    if (this.demoShots > 7 || !this.ammo.length) {
      var self = this;
      setTimeout(function () { if (PK.Game.scene === self && !self.winPending) self.nextDemo(); }, 5000);
      this.ammo.push('bomb', 'stone');
    }

  /* ---------- Girdi ---------- */
  S.onDown = function (p) {

      return;
    }
    if (this.state === 'fly') {
      var c = this.cur;
      var abilityLeft = c && !c.dead && !c.used && PK.AMMO[c.type].ability && (c.hitT < 0 || c.type === 'bomb');
      if (abilityLeft) this.tryAbility();
      else if (this.flyT > 2.2 && this.ammo.length && !this.winPending && !this.pw.attractors.length) this.endTurn();

  };
  S.onMove = function (p) {
    if (this.drag && p.id === this.drag.id) {

  };
  S.onUp = function (p) {

  };
  S.checkDoubleTap = function () {

  /* ---------- Fizik olayları ---------- */
  S.onPhys = function (t, d) {
    var P = this.P, A = PK.Audio, R = this.R;
    switch (t) {
      case 'impact': {
        var e = d.ent;
        if (d.E < 3 || !e) return;
        var k = U.clamp(d.E / 70, 0.05, 1);
        if (e.kind === 'blob') { A.play('blobHit', k, 90); e.hurtVis = R.t; e.squash = Math.min(1, (e.squash || 0) + k); }
        else if (e.mat) A.play(PK.MAT[e.mat].snd, k, 45);
        else if (e.kind === 'rag' && d.E > 8) A.play('blobHit', k * 0.6, 120);
        if (d.E > 30) P.impact(d.x, d.y, d.E, e.mat);
        break;
      }
      case 'break':
        P.debris(d.ent, d.vx, d.vy);
        var m = d.ent.mat;
        A.play(m === 'glass' ? 'glassBreak' : m === 'ice' ? 'iceBreak' : m === 'stone' ? 'stoneBreak' : m === 'metal' ? 'metalBreak' : 'woodBreak', 1, 35);
        break;
      case 'blobDeath': P.blobPop(d.ent); A.play('blobPop', 1, 30); break;
      case 'remove':
        if (d.ent.kind === 'balloon') { A.play('balloon', 1, 30); P.sparkle(d.ent.x, d.ent.y, d.ent.color, 10); P.puff(d.ent.x, d.ent.y, 0.6, d.ent.color); }
        break;
      case 'explosion':
        P.explosion(d.x, d.y, d.R); A.play('explosion', 1, 60); R.cam.shake(10);
        PK.Save.stat('sbBooms');
        break;
      case 'ability':
        if (d.kind === 'split') A.play('split'); else if (d.kind === 'dash') A.play('dash'); else if (d.kind === 'grow') A.play('grow'); else if (d.kind === 'blackhole') A.play('hole');
        break;
    }
  };

  /* ---------- Oluşturucular ---------- */
  S.addGroup = function (ents, joints) {

  };
  S.addJoint = function (j, type, extra) {

    var rec = { j: j, type: type, dead: false };
    if (extra) for (var k in extra) rec[k] = extra[k];
    j.__ent = rec;
    this.joints.push(rec);
    return rec;
  };

  S.ragdoll = function (x, y) {
    var pw = this.pw, gi = -(pw.groupCounter++);
    var shirt = COLORS[(Math.random() * COLORS.length) | 0], pants = '#3b4a7a', hair = ['#3b2416', '#e0a030', '#2a2140', '#a0522d'][(Math.random() * 4) | 0];
    var parts = [];

    function part(name, px, py, w, h, color, round) {
      var b = pw.world.createBody({ type: 'dynamic', position: V(x + px, y + py), angularDamping: 0.8, linearDamping: 0.05 });
      b.createFixture({ shape: round ? pl.Circle(w / 2) : pl.Box(w / 2, h / 2), density: round ? 0.9 : 1.1, friction: 0.7, restitution: 0.15, filterGroupIndex: gi });
      var e = pw.register(b, { kind: 'rag', part: name, w: w, h: h, r: round ? w / 2 : 0, color: color, hair: hair, draw: drawRag });
      parts.push(e); return e;
    }
    var head = part('head', 0, 1.67, 0.5, 0.5, '#ffd1a8', true);
    var torso = part('torso', 0, 1.12, 0.46, 0.72, shirt);
    var ual = part('arm', -0.31, 1.22, 0.16, 0.4, shirt), lal = part('arm', -0.31, 0.84, 0.14, 0.38, '#ffd1a8');
    var uar = part('arm', 0.31, 1.22, 0.16, 0.4, shirt), lar = part('arm', 0.31, 0.84, 0.14, 0.38, '#ffd1a8');
    var tl = part('leg', -0.12, 0.56, 0.19, 0.44, pants), sl = part('leg', -0.12, 0.17, 0.17, 0.42, pants);
    var tr = part('leg', 0.12, 0.56, 0.19, 0.44, pants), sr = part('leg', 0.12, 0.17, 0.17, 0.42, pants);
    var joints = [];
    var self = this;
    function rj(a, b, ax, ay, lo, hi) {
      var j = pw.world.createJoint(pl.RevoluteJoint({ enableLimit: true, lowerAngle: lo, upperAngle: hi }, a.body, b.body, V(x + ax, y + ay)));
      joints.push(self.addJoint(j, 'rag'));

    rj(torso, head, 0, 1.45, -0.6, 0.6);
    rj(torso, ual, -0.28, 1.4, -2.6, 2.6); rj(ual, lal, -0.31, 1.03, -2.4, 0.1);
    rj(torso, uar, 0.28, 1.4, -2.6, 2.6); rj(uar, lar, 0.31, 1.03, -0.1, 2.4);
    rj(torso, tl, -0.12, 0.78, -1.6, 0.6); rj(tl, sl, -0.12, 0.37, -0.1, 2.2);
    rj(torso, tr, 0.12, 0.78, -1.6, 0.6); rj(tr, sr, 0.12, 0.37, -0.1, 2.2);

  };

  S.balloon = function (x, y, color) {
    var pw = this.pw;
    var b = pw.world.createBody({ type: 'dynamic', position: V(x, y), linearDamping: 0.7, angularDamping: 2 });
    b.createFixture({ shape: pl.Circle(0.42), density: 0.12, friction: 0.3, restitution: 0.4 });
    var e = pw.register(b, { kind: 'balloon', r: 0.42, hp: 1.2, maxHp: 1.2, color: color || COLORS[(Math.random() * COLORS.length) | 0], draw: drawBalloon });
    e.force = function (w) {
      var g = w.world.getGravity();
      var m = b.getMass();
      var gl = Math.sqrt(g.x * g.x + g.y * g.y);
      if (gl < 0.01) { b.applyForceToCenter(V(0, 0.8), true); return; }
      b.applyForceToCenter(V(-g.x / gl * (m * gl + 6) , -g.y / gl * (m * gl + 6)), true);
    };
    e.onBlast = function () { pw.kill(e, 'blast'); };
    pw.forceEnts.push(e);
    this.addGroup([e]);

  };

  S.car = function (x, y) {

    var ce = pw.register(ch, { kind: 'car', color: COLORS[(Math.random() * COLORS.length) | 0], draw: drawCar, w: 2.6, h: 1 });

  S.seesaw = function (x, y) {

  S.windmill = function (x, y) {

  S.rope = function (A, B) {
    var pw = this.pw, gi = -(pw.groupCounter++);
    var dx = B.x - A.x, dy = B.y - A.y, L = Math.sqrt(dx * dx + dy * dy);
    if (L < 0.3) return;
    var n = Math.max(2, Math.min(40, Math.round(L / 0.32)));
    var segL = L / n, ang = Math.atan2(dy, dx);

    var self = this;
    for (var i = 0; i < n; i++) {
      var cx = A.x + dx * (i + 0.5) / n, cy = A.y + dy * (i + 0.5) / n;
      var b = pw.world.createBody({ type: 'dynamic', position: V(cx, cy), angle: ang, linearDamping: 0.1, angularDamping: 0.3 });
      b.createFixture({ shape: pl.Box(segL / 2, 0.05), density: 0.6, friction: 0.5, filterGroupIndex: gi });
      var e = pw.register(b, { kind: 'rope', w: segL, h: 0.1 });
      var px = A.x + dx * i / n, py = A.y + dy * i / n;
      var j = pw.world.createJoint(pl.RevoluteJoint({}, prev, b, V(px, py)));
      joints.push(self.addJoint(j, 'ropej'));
      segs.push(e); prev = b;
    }
    var jEnd = pw.world.createJoint(pl.RevoluteJoint({}, prev, B.ent ? B.ent.body : pw.groundBody, V(B.x, B.y)));
    joints.push(this.addJoint(jEnd, 'ropej'));
    var rj = pw.world.createJoint(pl.RopeJoint({ maxLength: L * 1.02, localAnchorA: (A.ent ? A.ent.body : pw.groundBody).getLocalPoint(V(A.x, A.y)), localAnchorB: (B.ent ? B.ent.body : pw.groundBody).getLocalPoint(V(B.x, B.y)) }, A.ent ? A.ent.body : pw.groundBody, B.ent ? B.ent.body : pw.groundBody));
    var rope = this.addJoint(rj, 'rope', { segs: segs, A: A, B: B });
    joints.push(rope);
    if (A.ent && A.ent.kind === 'balloon') A.ent.tied = true;
    if (B.ent && B.ent.kind === 'balloon') B.ent.tied = true;
    this.addGroup(segs, joints);
    return rope;
  };

  /* ---------- Hazır sahneler ---------- */
  S.loadScene = function (id, quiet) {
    this.clearAll();
    var pw = this.pw, self = this;
    var b = new PK.Builder(pw, { sleep: true, theme: 'meadow' });
    var cam = this.R.cam, fit = [ -2, 24, 12 ];
    switch (id) {
      case 'empty': fit = [-8, 16, 10]; break;
      case 'domino':
        b.hill(-4, 3, 3.2, 3.5);
        this.place(pw.addBall('iron', -1.0, 3.6, 0.4));
        for (var i = 0; i < 16; i++) b.post(i % 4 === 3 ? 'glass' : 'wood', 4.5 + i * 1.05, 0, 2.0, 0.3);
        b.frame('wood', 22.8, 0, 2.6, 1.6, { blob: 'normal' }); b.tnt(25, 0);
        b.blob(22.8, 1.9, 'small');
        fit = [-5, 27, 9];
        break;
      case 'jenga':
        b.tower(['wood', 'wood', 'glass', 'wood', 'stone', 'wood', 'ice', 'wood', 'wood', 'glass'], 10, 0, 10, 2.6, 1.1, { blobs: [null, 'small', null, null, 'small', null, null, 'small', null, null], top: 'king' });
        this.place(pw.addBall('iron', 2, 0.4, 0.4));
        fit = [-2, 18, 16];
        break;
      case 'pyramid':
        b.pyramid('wood', 10, 0, 7, 1);
        b.blob(10, 7, 'king'); b.blob(5.9, 0, 'normal'); b.blob(14.1, 0, 'normal');
        fit = [-1, 21, 11];
        break;
      case 'newton': {
        var bar = pw.addBlock('metal', 9, 7, 6.4, 0.3, 0); bar.body.setType('static'); bar.hp = Infinity;
        b.post('metal', 6.0, 0, 6.85, 0.3).body.setType('static'); b.post('metal', 12.0, 0, 6.85, 0.3).body.setType('static');
        for (var k = 0; k < 5; k++) {
          var bx = 7.4 + k * 0.81, by = 3.2;
          var ball;
          if (k === 0) { ball = pw.addBall('iron', bx - 3.65 * Math.sin(1.05), 6.85 - 3.65 * Math.cos(1.05), 0.4); }
          else ball = pw.addBall('iron', bx, by, 0.4);
          ball.hp = Infinity; ball.body.setAngularDamping(0);
          var fx = ball.body.getFixtureList(); fx.setRestitution(0.98); fx.setFriction(0);
          var j = pw.world.createJoint(pl.DistanceJoint({ frequencyHz: 0, dampingRatio: 0 }, bar.body, ball.body, V(bx, 6.85), ball.body.getPosition()));
          this.addJoint(j, 'string', { b: ball });
        }
        fit = [1, 17, 9];
        break;
      }
      case 'tnt':
        for (var t = 0; t < 7; t++) {
          b.tnt(3 + t * 2.4, 0);
          b.box(t % 2 ? 'stone' : 'wood', 3 + t * 2.4, 0.9, 0.9, 0.9);
          if (t % 2 === 0) b.blob(4.2 + t * 2.4, 0, 'small');
        }
        b.tower('wood', 21, 0, 3, 2.4, 1.4, { blobs: ['normal', 'normal', 'normal'] });
        fit = [0, 24, 9];
        break;
      case 'castle': {
        var def = PK.genFort(12, 4242, { world: 0 });
        def.build(b);
        fit = [5, 34, 12];
        break;
      }
      case 'bridge': {
        b.rock(2, 0, 2, 4); b.rock(18, 0, 2, 4);
        var prev = null, n = 14, x0 = 3, x1 = 17, seg = (x1 - x0) / n;
        var segs = [], joints = [];
        for (var q = 0; q < n; q++) {
          var pe = pw.addBlock('wood', x0 + seg * (q + 0.5), 3.85, seg - 0.04, 0.3, 0);
          pe.hp = pe.maxHp = 300;
          segs.push(pe);
          var jb = pw.world.createJoint(pl.RevoluteJoint({}, prev ? prev.body : pw.groundBody, pe.body, V(x0 + seg * q, 3.85)));
          joints.push(this.addJoint(jb, prev ? 'hinge' : 'pin', { b: pe }));
          prev = pe;
        }
        var jl = pw.world.createJoint(pl.RevoluteJoint({}, prev.body, pw.groundBody, V(x1, 3.85)));
        joints.push(this.addJoint(jl, 'pin', { b: prev }));
        this.addGroup(segs, joints);
        b.sleep = false;
        b.blob(7, 4.02, 'normal'); b.blob(10, 4.02, 'big'); b.blob(13, 4.02, 'normal');
        fit = [-1, 21, 10];
        break;
      }
      case 'ramp':
        b.hill(-10, 3, 4.5, 4);
        this.car(-3.6, 5.0);
        b.pyramid('wood', 14, 0, 4, 1); b.blob(14, 4, 'normal');
        b.tower('glass', 19, 0, 3, 2, 1.3, { blobs: ['small', null, 'small'] });
        fit = [-10, 22, 10];
        break;
      case 'party': {
        var pp = this.ragdoll(6, 2.0);
        var torso = pp[1];
        for (var bI = 0; bI < 5; bI++) {
          var bl = this.balloon(4.6 + bI * 0.7, 5.6 + (bI % 2) * 0.6);
          this.rope({ x: bl.x, y: bl.y - 0.42, ent: bl }, { x: torso.x, y: torso.y + 0.3, ent: torso });
        }
        this.seesaw(13, 0);
        this.ragdoll(11.3, 2.3);
        this.place(pw.addBall('iron', 14.6, 3.5, 0.4));
        fit = [0, 18, 10];
        break;
      }
    }
    var s = Math.min(this.R.W / (fit[1] - fit[0]), (this.R.H - 160) / fit[2]);
    s = U.clamp(s, 10, 60);
    cam.ts = s; cam.tx = (fit[0] + fit[1]) / 2; cam.ty = -1.2 + (this.R.H + 150) / (2 * s) - 150 / s;
    cam.ty = -1.2 + this.R.H / (2 * s) - 0 + (150 / s) * 0.5 * 0;
    this.frameBottom();
    if (!quiet) PK.Audio.play('pop', 0.6, 0);
  };
  S.place = function (e) { this.addGroup([e]); return e; };

    if (v && this.launch) {
      var x = this.launch.wx, y = this.launch.wy, vx = v.vx, vy = v.vy, g = this.pw.world.getGravity();
      var pts = [];
      for (var t = 0; t < 1.1 && pts.length < 40; t += 0.04) { x += vx * 0.04; y += vy * 0.04; vx += g.x * 0.04; vy += g.y * 0.04; pts.push({ x: x, y: y }); }
      R.drawTrajectory(pts);
      R.drawProjectile(this.sel, this.launch.wx, this.launch.wy, 0, PK.AMMO[this.sel].r, R.t);
      c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 0.05;
      var back = R.toWorld(this.launch.x, this.launch.y);
      c.beginPath(); c.moveTo(this.launch.wx, this.launch.wy); c.lineTo(back.x, back.y); c.stroke();
    }
    this.P.drawTexts(R);
  };

  S.drawJointBack = function (r) {
    var c = this.R.ctx;
    if (r.type === 'rope') {
      var segs = r.segs.filter(function (s) { return !s.dead; });
      if (!segs.length) return;
      c.strokeStyle = '#8a6136'; c.lineWidth = 0.09; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath();
      var a = r.j.getAnchorA(); c.moveTo(a.x, a.y);
      segs.forEach(function (s) { c.lineTo(s.rx, s.ry); });
      var b = r.j.getAnchorB(); c.lineTo(b.x, b.y);
      c.stroke();
      c.strokeStyle = 'rgba(255,230,180,0.35)'; c.lineWidth = 0.03; c.stroke();
    } else if (r.type === 'spring') {
      var p1 = r.j.getAnchorA(), p2 = r.j.getAnchorB();
      var dx = p2.x - p1.x, dy = p2.y - p1.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / L, ny = dx / L, n = 14;
      c.strokeStyle = '#5a6672'; c.lineWidth = 0.07; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(p1.x, p1.y);
      for (var k = 1; k < n; k++) { var t = k / n, o = (k % 2 ? 1 : -1) * 0.18; c.lineTo(p1.x + dx * t + nx * o, p1.y + dy * t + ny * o); }
      c.lineTo(p2.x, p2.y); c.stroke();
    } else if (r.type === 'string') {
      var s1 = r.j.getAnchorA(), s2 = r.j.getAnchorB();
      c.strokeStyle = '#4a4a55'; c.lineWidth = 0.035; c.beginPath(); c.moveTo(s1.x, s1.y); c.lineTo(s2.x, s2.y); c.stroke();
    }
  };
  S.drawJointFront = function (r) {
    var c = this.R.ctx;
    if (r.type === 'pin' || r.type === 'motor' || r.type === 'weld') {
      var a = r.j.getAnchorB ? r.j.getAnchorB() : r.j.getAnchorA();
      if (r.type === 'pin') {
        c.fillStyle = '#c9d2db'; c.strokeStyle = '#2a2140'; c.lineWidth = 0.04;
        c.beginPath(); c.arc(a.x, a.y, 0.13, 0, TAU); c.fill(); c.stroke();
        c.fillStyle = '#2a2140'; c.beginPath(); c.arc(a.x, a.y, 0.04, 0, TAU); c.fill();
      } else if (r.type === 'motor') {
        var ang = r.b && !r.b.dead ? r.b.ra : 0;
        c.save(); c.translate(a.x, a.y); c.rotate(ang);
        c.fillStyle = '#ffb43a'; c.strokeStyle = '#2a2140'; c.lineWidth = 0.04;
        c.beginPath(); c.arc(0, 0, 0.2, 0, TAU); c.fill(); c.stroke();
        for (var k = 0; k < 3; k++) { c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(k * TAU / 3) * 0.18, Math.sin(k * TAU / 3) * 0.18); c.stroke(); }
        c.restore();
      } else {
        c.fillStyle = '#7d8a96'; c.strokeStyle = '#2a2140'; c.lineWidth = 0.035;
        c.beginPath(); for (var q = 0; q < 6; q++) { var aa = q / 6 * TAU; c.lineTo(a.x + Math.cos(aa) * 0.12, a.y + Math.sin(aa) * 0.12); } c.closePath(); c.fill(); c.stroke();
      }
    } else if (r.type === 'spring' || r.type === 'rope') {
      [r.j.getAnchorA(), r.j.getAnchorB()].forEach(function (p, i) {
        var body = i === 0 ? r.j.getBodyA() : r.j.getBodyB();
        if (body && body.isStatic && body.isStatic() && !body.getUserData()) {
          c.fillStyle = '#5b3a1e'; c.beginPath(); c.arc(p.x, p.y, 0.1, 0, TAU); c.fill();
        }
      });
    }
  };
  S.onResize = function () { this.frameBottom(); };
})(PK.SandboxScene.prototype);

/* Ana döngü ve sahne yönetimi */

PK.Game = {
  init: function () {
    PK.Save.load();
    var cv = document.getElementById('cv');
    this.R = new PK.Renderer(cv);
    this.P = new PK.Particles();
    var self = this;
    this.input = new PK.Input(cv, function () { return self.scene; });
    PK.UI.init();
    this.R.resize();
    var rz = function () {
      PK.UI.applyRot();
      self.R.resize();
      if (self.scene && self.scene.onResize) self.scene.onResize();
      PK.UI.checkRotate();
    };
    GLOBAL.addEventListener('resize', rz);
    GLOBAL.addEventListener('orientationchange', function () { setTimeout(rz, 250); });
    document.addEventListener('visibilitychange', function () {
      var A = PK.Audio;
      if (!A.ctx) return;
      try { if (document.hidden) A.ctx.suspend(); else A.ctx.resume(); } catch (e) { }
    });
    // ilk dokunuşta sesi aç
    var unlock = function () { PK.Audio.unlock(); };
    GLOBAL.addEventListener('pointerdown', unlock, true);
    GLOBAL.addEventListener('touchend', unlock, true);
    GLOBAL.addEventListener('keydown', unlock, true);
    this.toMenu();
    this.last = performance.now();
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  },
  setScene: function (sc) {
    if (this.scene && this.scene.exit) this.scene.exit();
    PK.UI.closeModals();
    if (sc.mode !== 'demo') PK.UI.hideScreens();
    PK.Audio.sfxMute = sc.mode === 'demo';
    this.scene = sc;
    sc.enter();
  },
  toMenu: function (keepScreen) {
    if (!this.scene || this.scene.mode !== 'demo') this.setScene(new PK.SlingScene({ mode: 'demo' }));
    PK.Audio.music('menu');
    if (!keepScreen) PK.UI.showMenu();
  },
  startLevel: function (w, i) {
    var def = PK.LEVELS[w][i];
    this.setScene(new PK.SlingScene({ mode: 'level', world: w, index: i, def: def }));
    PK.UI.banner((w + 1) + '-' + (i + 1), def.name);
  },
  nextLevel: function (w, i) {
    i++;
    if (i >= 10) { w++; i = 0; }
    if (w >= PK.WORLDS.length) { this.toMenu(true); PK.UI.openWorlds(); return; }
    if (!PK.Save.levelUnlocked(w, i)) { this.toMenu(true); PK.UI.openLevels(Math.min(w, PK.WORLDS.length - 1)); return; }
    this.startLevel(w, i);
  },
  startEndless: function () { this.setScene(new PK.SlingScene({ mode: 'endless' })); },
  startSandbox: function () { this.setScene(new PK.SandboxScene()); },
  loop: function (ts) {
    var dt = Math.min(0.05, Math.max(0, (ts - this.last) / 1000));
    this.last = ts;
    this.frameDt = dt;
    try {
      if (this.scene) { this.scene.update(dt); this.scene.render(); }
    } catch (e) {
      if (!this._errShown) { this._errShown = true; console.error(e); }
    }
    PK.Save.data.stats.playSec += dt;
    requestAnimationFrame(this.loop);
  }
};

PK.boot = function () {
  var go = function () {
    if (!GLOBAL.planck) {
      document.getElementById('ui').innerHTML = '<div class="fatal">Fizik motoru yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</div>';
      var ld0 = document.getElementById('loading'); if (ld0) ld0.remove();
      return;
    }
    pl = GLOBAL.planck;
    PK.Game.init();
    var ld = document.getElementById('loading'); if (ld) ld.remove();
  };
  // CDN'den gelmediyse yedek kaynaktan dene
  var ensurePlanck = function (cb) {
    if (GLOBAL.planck) return cb();
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/planck@1.5.1/dist/planck.min.js';
    s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  };
  var fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
    document.fonts.load('700 20px DynaPuff'), document.fonts.load('800 16px Nunito'), document.fonts.load('900 16px Nunito')
  ]) : Promise.resolve();
  var done = false;
  var start = function () { if (done) return; done = true; ensurePlanck(go); };
  fontsReady.then(start, start);
  setTimeout(start, 1800);
};

(function () {
  var hot = GLOBAL.claude && GLOBAL.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return {}; }); } catch (e) { } }
  if (hot && hot.ready) hot.ready(PK.boot); else PK.boot();
})();

})();

     Ana menünün sol üst köşesine oyun seçim ekranına dönen "Oyunlar" düğmesini ekler.

<style>

#menu > .hub-back .ic { width: 18px; height: 18px; margin-left: -4px; }
</style>
<script>
(function () {
  'use strict';
  function addHubLink() {
    var menu = document.getElementById('menu');
    if (!menu) return false;
    if (!menu.querySelector('.hub-back')) {
      var a = document.createElement('a');
      a.className = 'btn sm hub-back';
      a.href = '../../';
      a.title = 'Tüm oyunlar';
      a.setAttribute('data-hub-back', '');
      var icon = window.PK && PK.ICON && PK.ICON.back;
      a.innerHTML = (icon || '\u2039 ') + 'Oyunlar';
      menu.appendChild(a);
    }
    return true;
  }
  if (addHubLink()) return;
  var ui = document.getElementById('ui');
  if (!ui || !window.MutationObserver) return;
  var mo = new MutationObserver(function () { if (addHubLink()) mo.disconnect(); });
  mo.observe(ui, { childList: true });
})();
</script>
<script src="../../hub/back.js" defer></script>
